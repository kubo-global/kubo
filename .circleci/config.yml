version: 2.1

jobs:
  build:
    docker:
      - image: cimg/php:8.5
        environment:
          APP_ENV: testing
          DB_CONNECTION: testing
    steps:
      - checkout

      - run:
          name: Clone kubo-kolibri sibling (path repo in composer.json)
          command: git clone --depth 1 https://github.com/kubo-global/kubo-kolibri.git ../kubo-kolibri

      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist

      - run:
          name: Setup environment
          command: |
            cp .env.example .env
            php artisan key:generate

      - run:
          name: Run Tests
          command: vendor/bin/phpunit
